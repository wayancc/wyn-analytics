server {
    listen 80;
    server_name stats.example.com;
    root /var/www/wyn-analytics/public;
    index index.php;

    # Access logs would record visitor IPs. Wyn Analytics doesn't need them.
    access_log off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~* \.(css|js|svg|woff2)$ {
        try_files $uri /index.php$is_args$args;   # /wyn.js is served by PHP
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}

# Cron alternative: run the worker with systemd (see wyn-analytics.service), or add
#   0 * * * * www-data php /var/www/wyn-analytics/bin/wyn-analytics run
